name: dyhanie
description: Эфемерный P2P мессенджер Дыхание
publish_to: 'none'
version: 1.0.2+10


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_webrtc: ^0.12.1+hotfix.1
  flutter_launcher_icons: ^0.14.3
  mobile_scanner: ^5.2.3
  characters: ^1.3.0
  google_fonts: ^6.2.1
  web_socket_channel: ^3.0.0
  shorebird_code_push: ^2.0.4
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1 
  package_info_plus: ^8.0.0
  record: 6.1.1
  video_compress: ^3.1.3
  video_player: ^2.9.2
  camera: ^0.11.0+2
  cryptography: ^2.9.0


dependency_overrides:
  record: 6.1.1
  record_linux: 1.2.1
  record_platform_interface: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome_logo.png
    - assets/images/welcome_bg.png
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/welcome_logo.png"
  adaptive_icon_background: "#1A1A1E"
  adaptive_icon_foreground: "assets/images/welcome_logo.png"
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21